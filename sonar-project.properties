sonar.projectKey=console-shop-customer
sonar.projectName=Console Shop — Customer Web (Next.js)
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/__tests__/**/*.test.tsx,src/__tests__/**/*.test.ts
sonar.exclusions=\
  src/app/**,\
  src/middleware.ts,\
  src/providers/**,\
  src/store/**,\
  src/hooks/**,\
  src/types/**,\
  src/lib/api.ts,\
  src/lib/guest.ts,\
  src/lib/socket.ts,\
  src/lib/serverFetch.ts,\
  src/lib/config.ts,\
  src/lib/flyToCart.ts,\
  src/components/chat/**,\
  src/components/layout/navbar.tsx,\
  src/components/layout/MegaMenu.tsx,\
  src/components/navbar/**,\
  src/components/payment/**,\
  src/components/cart/CartSidebar.tsx,\
  src/components/arcade/ArcadeBanner.tsx,\
  src/components/arcade/NeonCursor.tsx,\
  src/components/home/**,\
  **/node_modules/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=sonar-test-results.xml


name: Deploy Customer Web to GKE

on:
  push:
    branches:
      - dev

env:
  REGION: asia-southeast1
  REPO:   console-shop
  IMAGE:  customer-web
  DEPLOY: customer-web
  NS:     console-shop

jobs:
  build-and-deploy:
    name: Build, Push & Rollout
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push Docker image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}"
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            --build-arg NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }} \
            --build-arg NEXT_PUBLIC_OMISE_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_OMISE_PUBLIC_KEY }} \
            -t "${IMAGE_PATH}:latest" \
            -t "${IMAGE_PATH}:${{ github.sha }}" \
            .
          docker push "${IMAGE_PATH}:latest"
          docker push "${IMAGE_PATH}:${{ github.sha }}"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location:     ${{ secrets.GKE_ZONE }}
          project_id:   ${{ secrets.GCP_PROJECT_ID }}

      - name: Rollout restart
        run: |
          kubectl rollout restart deployment/${{ env.DEPLOY }} -n ${{ env.NS }}
          kubectl rollout status  deployment/${{ env.DEPLOY }} -n ${{ env.NS }} --timeout=120s

name: Deploy Customer Web to GKE

on:
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
  repository_dispatch:
    types: [deploy]

env:
  REGION: asia-southeast1
  REPO:   console-shop
  IMAGE:  customer-web
  DEPLOY: customer-web
  NS:     console-shop

jobs:
  # ── Job 1: Test + SonarQube quality gate ─────────────────────────────────────
  test-and-scan:
    name: Test & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Convert JUnit to SonarQube format
        run: node scripts/junit-to-sonar-generic.mjs test-results.xml sonar-test-results.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ── Job 2: Build + Deploy (only if tests pass) ────────────────────────────────
  build-and-deploy:
    name: Build, Push & Rollout
    needs: test-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: LBOEVSET/console-shop-customer-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: _config

      - name: Load dev config
        run: |
          set -a && source _config/environments/dev.env && set +a
          echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL"                   >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SOCKET_URL=$NEXT_PUBLIC_SOCKET_URL"             >> $GITHUB_ENV
          echo "NEXT_PUBLIC_OMISE_PUBLIC_KEY=$NEXT_PUBLIC_OMISE_PUBLIC_KEY" >> $GITHUB_ENV
          echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET"                           >> $GITHUB_ENV
          echo "NODE_ENV=$NODE_ENV"                                         >> $GITHUB_ENV
          echo "PORT=$PORT"                                                 >> $GITHUB_ENV
          echo "NEXT_PUBLIC_ZONE=$NEXT_PUBLIC_ZONE"                           >> $GITHUB_ENV

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push Docker image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}"
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL="${{ env.NEXT_PUBLIC_API_URL }}" \
            --build-arg NEXT_PUBLIC_SOCKET_URL="${{ env.NEXT_PUBLIC_SOCKET_URL }}" \
            --build-arg NEXT_PUBLIC_OMISE_PUBLIC_KEY="${{ env.NEXT_PUBLIC_OMISE_PUBLIC_KEY }}" \
            --build-arg NEXTAUTH_SECRET="${{ env.NEXTAUTH_SECRET }}" \
            --build-arg NODE_ENV="${{ env.NODE_ENV }}" \
            --build-arg PORT="${{ env.PORT }}" \
            --build-arg NEXT_PUBLIC_ZONE="${{ env.NEXT_PUBLIC_ZONE }}" \
            -t "${IMAGE_PATH}:latest" \
            -t "${IMAGE_PATH}:${{ github.sha }}" \
            .
          docker push "${IMAGE_PATH}:latest"
          docker push "${IMAGE_PATH}:${{ github.sha }}"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location:     ${{ secrets.GKE_ZONE }}
          project_id:   ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy
        run: |
          kubectl set image deployment/${{ env.DEPLOY }} \
            ${{ env.DEPLOY }}="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ github.sha }}" \
            -n ${{ env.NS }}
          kubectl rollout status deployment/${{ env.DEPLOY }} -n ${{ env.NS }} --timeout=120s
